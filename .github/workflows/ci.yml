# Build and test on every pull request and on main, with a SQL Server container for the web apps' tests.
# Warnings are errors (Directory.Build.props), and a NuGet vulnerability advisory fails restore, so this also flags
# vulnerable packages.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Throwaway, for this run's SQL Server container only (not a secret: it's reachable only from the runner).
      MSSQL_SA_PASSWORD: CiOnly${{ github.run_id }}Sql
    services:
      # For the web apps' database and page tests, which each create their own throwaway database on it.
      # Same image as compose.yaml.
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-CU10-ubuntu-24.04
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: CiOnly${{ github.run_id }}Sql
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s --health-timeout 5s --health-retries 18 --health-start-period 20s
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install age (used by the off-site backup tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Lint CloudFormation templates
        run: pipx run --spec cfn-lint==1.45.0 cfn-lint deploy/aws/*.yaml

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        env:
          ConnectionStrings__VehicleManagerTests: Server=localhost,1433;Database=master;User ID=sa;Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=True
          ConnectionStrings__PayAndPensionsTests: Server=localhost,1433;Database=master;User ID=sa;Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=True
        run: dotnet test --no-build -c Release --logger "console;verbosity=normal"
