# Sure (https://github.com/we-promise/sure): personal finance, self-hosted, at https://sure.<home domain> on the tailnet,
# through Caddy. Installed on the host in /opt/sure; settings and secrets in /etc/sure/sure.env. See
# deploy/sure/HOST-SETUP.md. Install or update with deploy/sure/deploy-sure.sh.
#
# Adapted from Sure's compose.example.yml: web and worker (Sidekiq) share one image, with PostgreSQL and Redis.
# Only web publishes a port, on 127.0.0.1:5084 (Docker's published ports bypass ufw). The built-in backup profiles are
# left out: backups are our own (a later change).
#
# Personal finance data: keep SECRET_KEY_BASE and the ACTIVE_RECORD_ENCRYPTION_* keys safe and never change them after
# first use, or what they encrypted can't be read again.

name: sure

x-sure-env: &sure-env
  SELF_HOSTED: "true"
  # Caddy ends TLS and tells the app it was https (X-Forwarded-Proto); the app itself speaks plain http.
  RAILS_ASSUME_SSL: "true"
  RAILS_FORCE_SSL: "false"
  DB_HOST: db
  DB_PORT: "5432"
  POSTGRES_USER: sure
  POSTGRES_DB: sure_production
  REDIS_URL: redis://redis:6379/1
  # Not set here, from /etc/sure/sure.env: POSTGRES_PASSWORD, SECRET_KEY_BASE, ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY,
  # ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY, ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT.

x-sure-app: &sure-app
  # Sure publishes `stable`; pin to a release tag from https://github.com/we-promise/sure/pkgs/container/sure once chosen
  # (then upgrading is an edit here and a deploy).
  image: ghcr.io/we-promise/sure:stable
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  env_file:
    - /etc/sure/sure.env
  environment:
    <<: *sure-env
  volumes:
    - app-storage:/rails/storage
  networks:
    - sure_net
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  web:
    <<: *sure-app
    ports:
      - "127.0.0.1:5084:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 768m

  worker:
    <<: *sure-app
    command: bundle exec sidekiq
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 768m

  db:
    image: postgres:16
    restart: unless-stopped
    # Not the image's own uid 999: on this host that is another service's user (which could then read the data folder).
    # The image supports an arbitrary --user as long as it owns the data folder (/var/lib/sure/postgres, 10002:10002).
    user: "10002:10002"
    security_opt:
      - no-new-privileges:true
    env_file:
      - /etc/sure/sure.env
    environment:
      POSTGRES_USER: sure
      POSTGRES_DB: sure_production
    volumes:
      - /var/lib/sure/postgres:/var/lib/postgresql/data
    networks:
      - sure_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    logging: *logging

  redis:
    # Upstream uses :latest; pinned to a major version here.
    image: redis:7
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - redis-data:/data
    networks:
      - sure_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    logging: *logging

volumes:
  # Uploaded and imported files (Sure's /rails/storage); a named volume so the image's own ownership applies.
  app-storage:
  redis-data:

networks:
  sure_net:
