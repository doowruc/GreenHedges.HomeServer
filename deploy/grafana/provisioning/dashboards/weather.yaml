# Dashboards are JSON files in this repository (deploy/grafana/dashboards/<folder>/), installed read-only: change them
# in a PR, not in Grafana (an edit there can be saved as a copy, or exported as JSON to commit). Removing a file
# removes its dashboard.
apiVersion: 1

providers:
  - name: weather
    folder: Weather
    folderUid: weather
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/dashboards/weather
