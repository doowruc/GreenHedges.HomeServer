# SQL Server for local development and the web apps' database tests (Vehicle Manager, Pay & Pensions): see "Local database" in
# docs/vehicle-manager/README.md. Only for this machine: the port is bound to localhost, and the sa password is in .env
# next to this file (git-ignored; copy .env.example). The home server will have its own setup (deploy/sqlserver/).
name: greenhedges-homeserver

services:
  sqlserver:
    # Pinned: update deliberately, and keep in step with the server's version.
    image: mcr.microsoft.com/mssql/server:2025-CU10-ubuntu-24.04
    platform: linux/amd64 # the image is x86 only; Apple Silicon runs it under Rosetta
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer # free for development and testing, never for real use
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (see .env.example)}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      # Shared with this machine like the server's backups folder, for Vehicle Manager's backup test (git-ignored).
      - ./.sqlserver-backups:/var/opt/mssql/backups
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  sqlserver-data:
